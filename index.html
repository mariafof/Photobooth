  // Borde ondulado (camino SVG). Sirve para la pantalla y para la postal impresa.
  function ondulado(w,h,ins,seg,rad,k){
    var x0=ins,y0=ins,x1=w-ins,y1=h-ins,d="M"+(x0+rad)+" "+y0,i,n,s,L;
    L=x1-x0-2*rad; n=Math.max(2,Math.round(L/seg)); s=L/n;
    for(i=0;i<n;i++) d+=" a"+s/2+" "+k*s+" 0 0 1 "+s+" 0";
    d+=" a"+rad+" "+rad+" 0 0 1 "+rad+" "+rad;
    L=y1-y0-2*rad; n=Math.max(2,Math.round(L/seg)); s=L/n;
    for(i=0;i<n;i++) d+=" a"+k*s+" "+s/2+" 0 0 1 0 "+s;
    d+=" a"+rad+" "+rad+" 0 0 1 "+(-rad)+" "+rad;
    L=x1-x0-2*rad; n=Math.max(2,Math.round(L/seg)); s=L/n;
    for(i=0;i<n;i++) d+=" a"+s/2+" "+k*s+" 0 0 1 "+(-s)+" 0";
    d+=" a"+rad+" "+rad+" 0 0 1 "+(-rad)+" "+(-rad);
    L=y1-y0-2*rad; n=Math.max(2,Math.round(L/seg)); s=L/n;
    for(i=0;i<n;i++) d+=" a"+k*s+" "+s/2+" 0 0 1 0 "+(-s);
    d+=" a"+rad+" "+rad+" 0 0 1 "+rad+" "+(-rad)+" Z";
    return d;
  }

  function mostrar(id){
    document.querySelectorAll(".pantalla").forEach(function(p){p.classList.remove("activa")});
    $(id).classList.add("activa");
    $("borde").style.display = (id==="camara") ? "none" : "block";

  function espera(ms){return new Promise(function(r){setTimeout(r,ms)})}

  function reiniciarInactividad(ms){
    clearTimeout(tiempoInactivo);
    tiempoInactivo = setTimeout(irAlInicio, ms || INACTIVIDAD_MS);

  function irAlInicio(){
    clearTimeout(tiempoInactivo);
    cancelarCaptura = true;
    ocupado = false; fotos = []; blobTira = null; urlSubida = null; aviso.textContent = "";
    if(stream){ stream.getTracks().forEach(function(track){track.stop()}); stream = null; }
    video.srcObject = null;
    $("contador").textContent = ""; $("cuenta").textContent = "";
    mostrar("inicio");
  }
  $("btnSalirCamara").addEventListener("click", irAlInicio);

  async function abrirCamara(){
    if(stream) return true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:"user", width:{ideal:1920}, height:{ideal:1080}}, audio:false
      });
      video.srcObject = stream;
      await video.play();
      return true;
    }catch(e){
      $("errorMsg").textContent = "No se pudo abrir la cámara. Toca Permitir cuando Safari lo pida. Si lo negaste, ve a Ajustes > Safari > Cámara y elige Preguntar o Permitir.";
      mostrar("errorPantalla");
      return false;
    }
  }

  function tomarFoto(){
    var c = document.createElement("canvas");
    var vw = video.videoWidth, vh = video.videoHeight;
    var ratio = 3/2; // foto horizontal 3:2
    var sw, sh;
    if(vw/vh > ratio){ sh = vh; sw = vh*ratio; } else { sw = vw; sh = vw/ratio; }
    c.width = 1200; c.height = 800;
    var x = c.getContext("2d");
    x.translate(c.width,0); x.scale(-1,1); // espejo, como se ve en pantalla
    x.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,c.width,c.height);
    return c;
  }

  // Cuenta regresiva + foto (sirve para la sesión y para volver a tomar una foto)
  async function capturar(i){
    $("contador").textContent = "Foto " + (i+1) + " de " + TOTAL_FOTOS;
    for(var s=SEGUNDOS_CUENTA;s>0;s--){
      if(cancelarCaptura) return null;
      $("cuenta").textContent = s;
      await espera(1000);
    }
    if(cancelarCaptura) return null;
    $("cuenta").textContent = "";
    var c = tomarFoto();
    var f = $("flash"); f.classList.add("on");
    await espera(80); f.classList.remove("on");
    return c;
  }

  function llenarRevision(){
    var rej = $("rejilla");
    rej.innerHTML = "";
    fotos.forEach(function(c,i){
      var celda = document.createElement("div"); celda.className = "celda";
      var im = document.createElement("img");
      im.src = c.toDataURL("image/jpeg", 0.8); im.alt = "Foto " + (i+1);
      var b = document.createElement("button"); b.type = "button";
      b.textContent = "Volver a tomar la foto " + (i+1);
      b.addEventListener("click", function(){ retomar(i); });
      celda.appendChild(im); celda.appendChild(b); rej.appendChild(celda);
    });
  }

  async function sesion(){
    if(ocupado) return;
    ocupado = true; cancelarCaptura = false; fotos = [];
    if(!(await abrirCamara())){ ocupado = false; return; }
    mostrar("camara");
    await espera(600);
    for(var i=0;i<TOTAL_FOTOS;i++){
      var foto = await capturar(i);
      if(cancelarCaptura || !foto){ ocupado = false; return; }
      fotos.push(foto);
      await espera(PAUSA_ENTRE_FOTOS_MS);
      if(cancelarCaptura){ ocupado = false; return; }
    }
    $("contador").textContent = "";
    llenarRevision();
    mostrar("revision");
    reiniciarInactividad();
    ocupado = false;
  }

  async function retomar(i){
    if(ocupado) return;
    ocupado = true; cancelarCaptura = false;
    clearTimeout(tiempoInactivo);
    if(!(await abrirCamara())){ ocupado = false; return; }
    mostrar("camara");
    await espera(600);
    var foto = await capturar(i);
    if(cancelarCaptura || !foto){ ocupado = false; return; }
    fotos[i] = foto;
    await espera(500);
    if(cancelarCaptura){ ocupado = false; return; }
    $("contador").textContent = "";
    llenarRevision();
    mostrar("revision");
    reiniciarInactividad();
    ocupado = false;
  }

  }

          window.crypto && typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID()
            : (Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + "-" + Math.random().toString(36).slice(2))
        );
        if(urlObjeto) URL.revokeObjectURL(urlObjeto);
        urlObjeto = URL.createObjectURL(b);
        tira.src = urlObjeto;
        $("imgImpresion").src = urlObjeto;
        resolver();
      }, "image/jpeg", 0.92);
    });
  }

  // La sesión nueva solo puede comenzar desde el botón principal de inicio.
  document.querySelector("#inicio .boton-grande").addEventListener("click", sesion);
  $("btnOtra").addEventListener("click", irAlInicio);
  $("btnListo").addEventListener("click", verPostal);
  $("btnRepetirTodo").addEventListener("click", irAlInicio);
  $("btnTerminar").addEventListener("click", irAlInicio);
  $("btnReintentarCam").addEventListener("click", irAlInicio);

  $("btnImprimir").addEventListener("click", function(){
    clearTimeout(tiempoInactivo); // no volver al inicio mientras se imprime
    if(urlObjeto){ $("imgImpresion").src = urlObjeto; }
    // Abrir la impresión directamente desde el clic del usuario.
    // No cambiar el estado de pantalla completa: el mismo flujo se usa en ambos modos.
    try{
      window.print();
    }catch(e){
      console.warn("No se pudo abrir la impresión:", e);
      reiniciarInactividad();
    }
  });
  window.addEventListener("afterprint", function(){
    reiniciarInactividad();
  });

  // Compartir con el menú de iOS (AirDrop, WhatsApp, Mensajes...)
  async function compartirNativo(){
    if(!blobTira) return;
    var archivo = new File([blobTira], "xmas-bazar.jpg", {type:"image/jpeg"});
    try{
      if(navigator.canShare && navigator.canShare({files:[archivo]})){
        await navigator.share({files:[archivo], title:NOMBRE_EVENTO});
      }else{
        window.open(tira.src, "_blank");
        $("qrAyuda").textContent = "Mantén presionada la foto y elige Guardar imagen.";
      }
    }catch(e){ /* el invitado canceló */ }
  }

  // Sube la postal a Cloudinary y devuelve el enlace público
  async function subirPostal(){
    if(urlSubida) return urlSubida;
    if(!CLOUDINARY_CLOUD || !CLOUDINARY_PRESET) throw new Error("sin-configurar");
    if(!idPostalCloud || !blobTira) throw new Error("No se ha generado una postal nueva para este código QR.");
    var datos = new FormData();
    datos.append("file", blobTira, "xmas-bazar.jpg");
    datos.append("upload_preset", CLOUDINARY_PRESET);
    // ID diferente para cada postal: cada QR apunta a una imagen independiente.
    datos.append("public_id", idPostalCloud);
    var ctl = new AbortController();
    var corte = setTimeout(function(){ ctl.abort(); }, 45000);
    try{
      var res = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD + "/image/upload", {method:"POST", body:datos, signal:ctl.signal});
      var j;
      try { j = await res.json(); } catch(parseError) { throw new Error("Cloudinary no devolvió una respuesta válida (HTTP " + res.status + ")."); }
      if(!res.ok){
        var motivo = j && j.error && j.error.message ? j.error.message : ("HTTP " + res.status);
        throw new Error("Cloudinary: " + motivo);
      }
      if(!j || !j.secure_url) throw new Error("Cloudinary recibió la postal, pero no devolvió un enlace público.");
      urlSubida = j.secure_url;
      return urlSubida;
    }finally{ clearTimeout(corte); }
  }

  function dibujarQR(texto){
    var qr = new QRCodeLib(-1, 0); // tamaño automático, corrección de errores nivel M
    qr.addData(texto); qr.make();
    var n = qr.getModuleCount(), m = 4, esc = Math.max(4, Math.floor(700/(n+2*m)));
    var cv = $("qrCanvas"), px = (n+2*m)*esc;
    cv.width = px; cv.height = px;
    var c = cv.getContext("2d");
    c.fillStyle = "#fff"; c.fillRect(0,0,px,px);
    c.fillStyle = "#17261f";
    for(var f=0;f<n;f++) for(var k=0;k<n;k++) if(qr.isDark(f,k)) c.fillRect((k+m)*esc,(f+m)*esc,esc,esc);
  }

  async function abrirQR(){
    if(!blobTira) return;
    mostrar("qrPantalla");
    reiniciarInactividad(INACTIVIDAD_QR_MS);
    $("qrAyuda").textContent = "Apunta la cámara de tu celular al código y guarda la foto en tu galería.";
    $("qrCanvas").style.display = "none";
    $("btnQrReintentar").hidden = true;
    $("qrEstado").style.display = "flex";
    $("qrEstado").textContent = "Preparando tu código QR…";
    try{
      var url = await subirPostal();
      if(!$("qrPantalla").classList.contains("activa")) return; // el invitado ya salió de esta pantalla
      dibujarQR(url);
      $("qrCanvas").style.display = "block";
      $("qrEstado").style.display = "none";
    }catch(e){
      if(!$("qrPantalla").classList.contains("activa")) return;
      console.warn("QR:", e && e.message);
      $("qrEstado").textContent = (e && e.message === "sin-configurar")
        ? "Falta configurar Cloudinary. Revisa el nombre de la cuenta y el Upload Preset."
        : "No se pudo crear el código QR. " + ((e && e.message) ? e.message : "Revisa la conexión a internet e inténtalo de nuevo.");
      $("btnQrReintentar").hidden = false;
    }
  }

  $("btnCompartir").addEventListener("click", abrirQR);
  $("btnQrReintentar").addEventListener("click", abrirQR);
  $("btnQrCompartir").addEventListener("click", function(){ reiniciarInactividad(INACTIVIDAD_QR_MS); compartirNativo(); });
  $("btnQrVolver").addEventListener("click", function(){ mostrar("resultado"); reiniciarInactividad(); });

  // Evita que la pantalla se apague (si el navegador lo permite)
  async function mantenerEncendida(){
    try{ if("wakeLock" in navigator){ await navigator.wakeLock.request("screen"); } }catch(e){}
  }
  mantenerEncendida();
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") mantenerEncendida();
  });
})();
</script>
