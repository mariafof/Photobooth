<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photobooth">
<title>XMAS BAZAR Photobooth</title>
<style>
  :root{
    --pino:#12392b; --pino-osc:#0b241b; --cereza:#b3203a; --oro:#e8b94a; --crema:#fbf3e2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pino-osc);color:var(--crema);
    font-family:"Georgia","Times New Roman",serif;touch-action:manipulation}
  .pantalla{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px}
  .pantalla.activa{display:flex}

  /* Inicio */
  #inicio{background:radial-gradient(circle at 50% 35%,var(--pino) 0%,var(--pino-osc) 75%);cursor:pointer}
  #inicio h1{font-size:clamp(56px,13vw,150px);letter-spacing:.06em;margin:0;color:var(--oro);line-height:.95;font-weight:700}
  #inicio h2{font-size:clamp(28px,6vw,64px);margin:.2em 0 1.2em;font-style:italic;font-weight:400;color:var(--crema)}
  .boton-grande{font:700 clamp(24px,4vw,40px) "Georgia",serif;padding:.7em 1.6em;border:0;border-radius:999px;
    background:var(--cereza);color:var(--crema);box-shadow:0 0 0 6px var(--oro);animation:pulso 1.8s ease-in-out infinite}
  @keyframes pulso{50%{transform:scale(1.05)}}
  @media (prefers-reduced-motion:reduce){.boton-grande{animation:none}}

  /* Cámara */
  #camara{background:#000;padding:0}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #cuenta{position:relative;font-size:clamp(140px,40vw,420px);font-weight:700;color:var(--crema);
    text-shadow:0 6px 30px rgba(0,0,0,.7);line-height:1}
  #contador{position:absolute;top:max(20px,env(safe-area-inset-top));left:0;right:0;font-size:clamp(24px,4vw,40px);
    color:var(--crema);text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  #flash.on{opacity:1;transition:none}

  /* Resultado */
  #resultado{background:var(--pino-osc);gap:16px}
  #resultado h3{margin:0;font-size:clamp(26px,4vw,40px);color:var(--oro)}
  #tira{max-height:68vh;max-width:90vw;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .botones{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .botones button{font:700 clamp(18px,2.6vw,26px) "Georgia",serif;padding:.8em 1.4em;border:0;border-radius:14px;
    background:var(--oro);color:var(--pino-osc)}
  .botones button.sec{background:transparent;color:var(--crema);box-shadow:inset 0 0 0 3px var(--crema)}
  #aviso{min-height:1.4em;color:var(--oro);font-size:18px}

  #errorMsg{max-width:600px;font-size:22px;line-height:1.4}

  /* Impresión */
  #hojaImpresion{display:none}
  @page{size:4in 6in;margin:0}
  @media print{
    body>*:not(#hojaImpresion){display:none!important}
    html,body{overflow:visible;height:auto;background:#fff}
    #hojaImpresion{display:block}
    #hojaImpresion img{width:4in;height:6in;display:block}
  }
</style>
</head>
<body>

<section id="inicio" class="pantalla activa">
  <h1>XMAS<br>BAZAR</h1>
  <h2>¡Tu foto navideña!</h2>
  <button class="boton-grande" type="button">Toca para comenzar</button>
</section>

<section id="camara" class="pantalla">
  <video id="video" autoplay playsinline muted></video>
  <div id="contador"></div>
  <div id="cuenta"></div>
  <div id="flash"></div>
</section>

<section id="resultado" class="pantalla">
  <h3>¡Quedaron geniales!</h3>
  <img id="tira" alt="Tu tira de fotos">
  <div id="aviso"></div>
  <div class="botones">
    <button id="btnImprimir" type="button">Imprimir</button>
    <button id="btnCompartir" type="button">Compartir / Guardar</button>
    <button id="btnOtra" type="button" class="sec">Otra vez</button>
    <button id="btnTerminar" type="button" class="sec">Terminar</button>
  </div>
</section>

<section id="errorPantalla" class="pantalla">
  <p id="errorMsg"></p>
  <div class="botones"><button class="sec" id="btnReintentarCam" type="button" style="background:var(--oro);color:var(--pino-osc)">Reintentar</button></div>
</section>

<div id="hojaImpresion"><img id="imgImpresion" alt=""></div>
<canvas id="lienzo" width="1200" height="1800" hidden></canvas>

<script>
(function(){
  var NOMBRE_EVENTO = "XMAS BAZAR";   // <- cambia el texto del marco aquí
  var TOTAL_FOTOS = 4;
  var SEGUNDOS_CUENTA = 3;
  var PAUSA_ENTRE_FOTOS_MS = 1200;
  var INACTIVIDAD_MS = 60000;         // vuelve al inicio tras 60 s sin tocar

  var $ = function(id){return document.getElementById(id)};
  var video = $("video"), lienzo = $("lienzo"), tira = $("tira"), aviso = $("aviso");
  var stream = null, fotos = [], ocupado = false, tiempoInactivo = null, blobTira = null;

  function mostrar(id){
    document.querySelectorAll(".pantalla").forEach(function(p){p.classList.remove("activa")});
    $(id).classList.add("activa");
  }
  function espera(ms){return new Promise(function(r){setTimeout(r,ms)})}

  function reiniciarInactividad(){
    clearTimeout(tiempoInactivo);
    tiempoInactivo = setTimeout(irAlInicio, INACTIVIDAD_MS);
  }
  document.addEventListener("touchstart", function(){
    if($("resultado").classList.contains("activa")) reiniciarInactividad();
  }, {passive:true});

  function irAlInicio(){
    clearTimeout(tiempoInactivo);
    ocupado = false; fotos = []; blobTira = null; aviso.textContent = "";
    mostrar("inicio");
  }

  async function abrirCamara(){
    if(stream) return true;
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:"user", width:{ideal:1920}, height:{ideal:1080}}, audio:false
      });
      video.srcObject = stream;
      await video.play();
      return true;
    }catch(e){
      $("errorMsg").textContent = "No se pudo abrir la cámara. Toca Permitir cuando Safari lo pida. Si lo negaste, ve a Ajustes > Safari > Cámara y elige Preguntar o Permitir.";
      mostrar("errorPantalla");
      return false;
    }
  }

  function tomarFoto(){
    var c = document.createElement("canvas");
    var vw = video.videoWidth, vh = video.videoHeight;
    var ratio = 3/4; // foto vertical 3:4
    var sw, sh;
    if(vw/vh > ratio){ sh = vh; sw = vh*ratio; } else { sw = vw; sh = vw/ratio; }
    c.width = 900; c.height = 1200;
    var x = c.getContext("2d");
    x.translate(c.width,0); x.scale(-1,1); // espejo, como se ve en pantalla
    x.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,c.width,c.height);
    return c;
  }

  async function sesion(){
    if(ocupado) return;
    ocupado = true; fotos = [];
    if(!(await abrirCamara())){ ocupado = false; return; }
    mostrar("camara");
    await espera(600);
    for(var i=1;i<=TOTAL_FOTOS;i++){
      $("contador").textContent = "Foto " + i + " de " + TOTAL_FOTOS;
      for(var s=SEGUNDOS_CUENTA;s>0;s--){
        $("cuenta").textContent = s;
        await espera(1000);
      }
      $("cuenta").textContent = "";
      fotos.push(tomarFoto());
      var f = $("flash"); f.classList.add("on");
      await espera(80); f.classList.remove("on");
      await espera(PAUSA_ENTRE_FOTOS_MS);
    }
    $("contador").textContent = "";
    armarTira();
    mostrar("resultado");
    reiniciarInactividad();
    ocupado = false;
  }

  function armarTira(){
    var W = lienzo.width, H = lienzo.height, x = lienzo.getContext("2d");
    x.fillStyle = "#12392b"; x.fillRect(0,0,W,H);
    // borde dorado
    x.strokeStyle = "#e8b94a"; x.lineWidth = 8; x.strokeRect(14,14,W-28,H-28);
    // encabezado
    x.fillStyle = "#e8b94a"; x.textAlign = "center"; x.textBaseline = "middle";
    x.font = "bold 120px Georgia, serif";
    x.fillText(NOMBRE_EVENTO, W/2, 115);
    // fotos 2x2
    var pw = 520, ph = 693, gap = 40;
    var x0 = (W - (pw*2 + gap))/2, y0 = 235;
    for(var i=0;i<TOTAL_FOTOS;i++){
      var col = i%2, fila = Math.floor(i/2);
      var px = x0 + col*(pw+gap), py = y0 + fila*(ph+gap);
      x.fillStyle = "#fbf3e2"; x.fillRect(px-8,py-8,pw+16,ph+16);
      x.drawImage(fotos[i],px,py,pw,ph);
    }
    // pie
    x.fillStyle = "#fbf3e2"; x.font = "italic 48px Georgia, serif";
    var fecha = new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
    x.fillText("¡Felices fiestas!  " + fecha, W/2, H-62);

    lienzo.toBlob(function(b){
      blobTira = b;
      var url = URL.createObjectURL(b);
      tira.src = url;
      $("imgImpresion").src = url;
    }, "image/jpeg", 0.92);
  }

  $("inicio").addEventListener("click", sesion);
  $("btnOtra").addEventListener("click", sesion);
  $("btnTerminar").addEventListener("click", irAlInicio);
  $("btnReintentarCam").addEventListener("click", function(){ irAlInicio(); sesion(); });

  $("btnImprimir").addEventListener("click", function(){
    reiniciarInactividad();
    clearTimeout(tiempoInactivo); // no volver al inicio mientras se imprime
    setTimeout(function(){ window.print(); reiniciarInactividad(); }, 150);
  });

  $("btnCompartir").addEventListener("click", async function(){
    reiniciarInactividad();
    if(!blobTira) return;
    var archivo = new File([blobTira], "xmas-bazar.jpg", {type:"image/jpeg"});
    try{
      if(navigator.canShare && navigator.canShare({files:[archivo]})){
        await navigator.share({files:[archivo], title:NOMBRE_EVENTO});
      }else{
        window.open(tira.src, "_blank");
        aviso.textContent = "Mantén presionada la foto y elige Guardar imagen.";
      }
    }catch(e){ /* el invitado canceló */ }
  });

  // Evita que la pantalla se apague (si el navegador lo permite)
  async function mantenerEncendida(){
    try{ if("wakeLock" in navigator){ await navigator.wakeLock.request("screen"); } }catch(e){}
  }
  mantenerEncendida();
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") mantenerEncendida();
  });
})();
</script>
</body>
</html>
